<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>贪吃蛇 360°</title>
    
    <!-- PWA 配置支持 -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --accent: #e94560;
            --accent2: #00d4aa;
            --text: #eaeaea;
            --muted: #8892a4;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; background: var(--bg);
            color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden; }

        /* ── PAGES ── */
        .page { position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 16px);
            opacity: 0; pointer-events: none; transition: opacity 0.25s; }
        .page.active { opacity: 1; pointer-events: all; }

        /* ── MENU ── */
        #menuPage { justify-content: center; gap: 20px; }
        .logo { font-size: 52px; line-height: 1; filter: drop-shadow(0 0 16px rgba(0,212,170,.5)); }
        .game-title { font-size: 28px; font-weight: 800; letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu-card { width: 100%; max-width: 360px; background: var(--surface);
            border: 1px solid rgba(255,255,255,.08); border-radius: 20px; padding: 20px;
            display: flex; flex-direction: column; gap: 16px; }
        .field-label { font-size: 12px; font-weight: 700; color: var(--muted);
            letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
        input[type="text"] { width: 100%; padding: 14px 16px;
            background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px; color: var(--text); font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: var(--accent2); }
        input[type="text"]::placeholder { color: var(--muted); }
        .speed-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
        .speed-btn { padding: 10px 4px; border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.04); border-radius: 10px;
            color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
        .speed-btn.active { background: var(--accent2); border-color: var(--accent2); color: #000; }
        .menu-btns { display: flex; flex-direction: column; gap: 10px; }
        .btn-primary { width: 100%; padding: 16px; border: none; border-radius: 14px;
            font-size: 17px; font-weight: 700; cursor: pointer;
            background: linear-gradient(135deg, var(--accent2), #00b894);
            color: #000; box-shadow: 0 4px 20px rgba(0,212,170,.3); }
        .btn-secondary { width: 100%; padding: 14px; border: 1px solid rgba(255,255,255,.15);
            border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
            background: transparent; color: var(--text); }
        .btn-secondary:disabled { opacity: 0.3; cursor: not-allowed; }
        .lb-section { width: 100%; max-width: 360px; }
        .lb-title { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 1px;
            text-transform: uppercase; margin-bottom: 10px; text-align: center; }
        .lb-list { display: flex; flex-direction: column; gap: 6px; }
        .lb-item { display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; background: var(--surface);
            border: 1px solid rgba(255,255,255,.06); border-radius: 10px; font-size: 14px; }
        .lb-rank { font-weight: 800; margin-right: 10px; }
        .lb-score { font-weight: 700; color: var(--accent2); }

        /* ── GAME PAGE ── */
        #gamePage { padding: 0; gap: 0; justify-content: flex-start; }
        .hud { width: 100%; padding: calc(var(--safe-top) + 10px) 16px 10px;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface); border-bottom: 1px solid rgba(255,255,255,.06); flex-shrink: 0; }
        .hud-player { font-size: 13px; font-weight: 700; color: var(--accent2); }
        .hud-score { font-size: 22px; font-weight: 800; }
        .hud-actions { display: flex; gap: 8px; }
        .hud-btn { padding: 7px 14px; border-radius: 8px; font-size: 13px;
            font-weight: 700; border: none; cursor: pointer; }
        .hud-pause { background: rgba(255,255,255,.12); color: var(--text); }
        .hud-exit  { background: rgba(233,69,96,.2); color: var(--accent); }

        .canvas-wrap { flex: 1; width: 100%; display: flex; align-items: center;
            justify-content: center; padding: 8px; position: relative; overflow: hidden; }
        canvas { display: block; border-radius: 14px;
            border: 2px solid rgba(255,255,255,.08); touch-action: none; background: #0d0d1a; }

        /* Pause overlay */
        .overlay { position: absolute; inset: 0; background: rgba(10,10,25,.88);
            backdrop-filter: blur(6px); display: none; flex-direction: column;
            justify-content: center; align-items: center; gap: 20px;
            border-radius: 14px; z-index: 20; }
        .overlay h2 { font-size: 22px; font-weight: 800; }
        .overlay-btn { padding: 14px 36px; border-radius: 14px; font-size: 17px;
            font-weight: 700; border: none; cursor: pointer;
            background: var(--accent2); color: #000; }

        /* ── JOYSTICK ── */
        .joystick-area { flex-shrink: 0; width: 100%; display: flex;
            justify-content: center; align-items: center;
            padding-bottom: calc(var(--safe-bottom) + 14px); padding-top: 6px;
            background: var(--bg); }

        .joystick-zone { position: relative; width: 210px; height: 210px;
            background: var(--surface); border-radius: 50%;
            border: 2px solid rgba(255,255,255,.1);
            display: flex; justify-content: center; align-items: center;
            touch-action: none;
            box-shadow: 0 4px 28px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07); }

        .joystick-zone::before {
            content: '';
            position: absolute; inset: 8px;
            border-radius: 50%;
            border: 1px dashed rgba(255,255,255,.08);
            pointer-events: none;
        }

        .j-label { position: absolute; font-size: 12px; color: rgba(255,255,255,.22);
            pointer-events: none; font-weight: 700; }
        .j-n { top: 10px; }
        .j-s { bottom: 10px; }
        .j-w { left: 10px; }
        .j-e { right: 10px; }

        .joystick-handle { position: absolute; width: 86px; height: 86px;
            background: radial-gradient(circle at 35% 35%, #00e5b8, var(--accent2));
            border-radius: 50%;
            box-shadow: 0 4px 18px rgba(0,212,170,.55);
            transition: transform 0.04s ease-out;
            pointer-events: none; display: flex; justify-content: center;
            align-items: center; color: rgba(0,0,0,.45); font-size: 24px; }

        #dirCanvas { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }

        /* Combo */
        .combo-text { position: absolute; top: 38%; left: 50%;
            transform: translate(-50%,-50%) scale(0.5); font-size: 28px; font-weight: 900;
            background: linear-gradient(45deg,#ff2d55,#ffcc00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            pointer-events: none; opacity: 0; z-index: 10; white-space: nowrap;
            transition: all .45s cubic-bezier(.175,.885,.32,1.275); }
        .combo-text.show { opacity: 1; transform: translate(-50%,-70%) scale(1.15); }

        canvas.combo-glow { animation: comboPulse .6s ease-in-out 2; }
        @keyframes comboPulse {
            0%   { border-color: var(--accent); box-shadow: 0 0 24px rgba(233,69,96,.7); }
            50%  { border-color: #ffcc00;       box-shadow: 0 0 30px rgba(255,204,0,.8); }
            100% { border-color: rgba(255,255,255,.08); box-shadow: none; }
        }
    </style>
</head>
<body>

<!-- MENU -->
<div class="page active" id="menuPage">
    <div class="logo">🐍</div>
    <div class="game-title">贪吃蛇 360°</div>
    <div class="menu-card">
        <div>
            <div class="field-label">玩家名字</div>
            <input type="text" id="playerName" placeholder="输入名字" maxlength="10">
        </div>
        <div>
            <div class="field-label">速度</div>
            <div class="speed-grid">
                <button class="speed-btn" data-speed="1.5">极慢</button>
                <button class="speed-btn" data-speed="2.5">慢速</button>
                <button class="speed-btn active" data-speed="3.5">中速</button>
                <button class="speed-btn" data-speed="4.5">快速</button>
            </div>
        </div>
        <div class="menu-btns">
            <button class="btn-primary" id="startBtn">开始游戏</button>
            <button class="btn-secondary" id="loadBtn" disabled>读取存档</button>
        </div>
    </div>
    <div class="lb-section">
        <div class="lb-title">🏆 历史最佳</div>
        <ul class="lb-list" id="leaderboardList"></ul>
    </div>
</div>

<!-- GAME -->
<div class="page" id="gamePage">
    <div class="hud">
        <div>
            <div class="hud-player" id="displayName">玩家</div>
            <div class="hud-score"><span id="currentScore">0</span> 分</div>
        </div>
        <div class="hud-actions">
            <button class="hud-btn hud-pause" id="pauseBtn">暂停</button>
            <button class="hud-btn hud-exit"  id="exitBtn">退出</button>
        </div>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
        <div class="combo-text" id="comboText">🔥 COMBO!</div>
        <canvas id="gameCanvas"></canvas>
        <div class="overlay" id="pauseOverlay">
            <h2>⏸ 已暂停</h2>
            <button class="overlay-btn" id="resumeBtn">继续游戏</button>
        </div>
    </div>
    <div class="joystick-area">
        <div class="joystick-zone" id="joystickZone">
            <span class="j-label j-n">N</span>
            <span class="j-label j-s">S</span>
            <span class="j-label j-w">W</span>
            <span class="j-label j-e">E</span>
            <canvas id="dirCanvas" width="210" height="210"></canvas>
            <div class="joystick-handle" id="joystickHandle">✽</div>
        </div>
    </div>
</div>

<script>
// ── ELEMENTS ──────────────────────────────
const canvas       = document.getElementById('gameCanvas');
const ctx          = canvas.getContext('2d');
const dirCanvas    = document.getElementById('dirCanvas');
const dctx         = dirCanvas.getContext('2d');
const scoreEl      = document.getElementById('currentScore');
const displayNameEl= document.getElementById('displayName');
const nameInput    = document.getElementById('playerName');
const startBtn     = document.getElementById('startBtn');
const loadBtn      = document.getElementById('loadBtn');
const pauseBtn     = document.getElementById('pauseBtn');
const resumeBtn    = document.getElementById('resumeBtn');
const exitBtn      = document.getElementById('exitBtn');
const speedBtns    = document.querySelectorAll('.speed-btn');
const lbList       = document.getElementById('leaderboardList');
const menuPage     = document.getElementById('menuPage');
const gamePage     = document.getElementById('gamePage');
const pauseOverlay = document.getElementById('pauseOverlay');
const comboText    = document.getElementById('comboText');
const joystickZone = document.getElementById('joystickZone');
const joystickHandle = document.getElementById('joystickHandle');

// ── CANVAS CALIBRATION ────────────────────
let W = 320, H = 320;

function calibrateCanvas() {
    const HUD_H = 72, STICK_H = 234;
    const availH = window.innerHeight - HUD_H - STICK_H - 16;
    const availW = window.innerWidth - 16;
    const side = Math.min(availH, availW, 480);
    W = H = Math.max(240, side);
    canvas.width  = W; canvas.height = H;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
}
calibrateCanvas();
window.addEventListener('resize', () => { calibrateCanvas(); });

// ── 360° SNAKE CORE ───────────────────────
const SNAKE_SPEED_DEFAULT = 3.5;   // 默认中速
const SNAKE_RADIUS = 5.6;        
const FOOD_RADIUS  = 9;
const SEGMENT_LEN  = SNAKE_RADIUS * 2.2; 

const rainbowColors = ['#ff2d55','#ff9500','#ffcc00','#34c759','#007aff','#af52de'];
const headThemes    = ['#00d4aa','#af52de','#ff2d55','#5856d6','#ff9500','#00c7be'];

// Game state
let snakePoints = [];  
let snakeLength = 60;  
let angle      = 0;    
let snakeSpeed = SNAKE_SPEED_DEFAULT;
let food       = { x: 100, y: 100 };
let score      = 0, foodEatenCount = 0;
let isComboMode = false;
let currentHeadColor = '#00d4aa';
let currentPlayerName = '', playerChar = '🐍';
let gameRunning = false, isPaused = false;
let rafId = null;
let lastTime = 0;

// Joystick state
let joystickActive = false;
let targetAngle    = 0;   
let hasJoystickInput = false;  

// ── SPEED BUTTONS ─────────────────────────
speedBtns.forEach(btn => btn.addEventListener('click', () => {
    speedBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    snakeSpeed = parseFloat(btn.dataset.speed);
}));

// ── PAGE SWITCH ───────────────────────────
function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// ── BUTTONS ───────────────────────────────
startBtn.addEventListener('click', () => initGame(false));
loadBtn.addEventListener('click',  loadSavedGame);
pauseBtn.addEventListener('click', togglePause);
resumeBtn.addEventListener('click', togglePause);
exitBtn.addEventListener('click',  exitGame);
document.addEventListener('keydown', handleKey);
checkSavedGame(); updateLeaderboardUI();

// ── JOYSTICK ──────────────────────────────
let jcx = 0, jcy = 0;
const MAX_RADIUS = 70;

function updateJoystick(cx, cy) {
    const dx = cx - jcx, dy = cy - jcy;
    const dist = Math.hypot(dx, dy);

    const clamped = Math.min(dist, MAX_RADIUS);
    const ang = Math.atan2(dy, dx);
    const hx = Math.cos(ang) * clamped;
    const hy = Math.sin(ang) * clamped;
    joystickHandle.style.transform = `translate(${hx}px,${hy}px)`;

    if (dist > 12) {
        targetAngle = ang;
        hasJoystickInput = true;
        drawDirArc(ang);
    } else {
        hasJoystickInput = false;
        clearDirArc();
    }
}

function resetJoystick() {
    joystickActive = false;
    hasJoystickInput = false;
    joystickHandle.style.transform = 'translate(0,0)';
    clearDirArc();
}

function drawDirArc(ang) {
    const sz = 210;
    dctx.clearRect(0, 0, sz, sz);
    const cx = sz/2, cy = sz/2, r = sz/2 - 6;
    dctx.save();
    dctx.strokeStyle = 'rgba(0,212,170,0.35)';
    dctx.lineWidth = 3;
    dctx.shadowColor = '#00d4aa';
    dctx.shadowBlur = 8;
    dctx.beginPath();
    dctx.arc(cx, cy, r, ang - 0.25, ang + 0.25);
    dctx.stroke();
    dctx.fillStyle = '#00d4aa';
    dctx.shadowBlur = 12;
    dctx.beginPath();
    dctx.arc(cx + Math.cos(ang)*r, cy + Math.sin(ang)*r, 5, 0, Math.PI*2);
    dctx.fill();
    dctx.restore();
}

function clearDirArc() {
    dctx.clearRect(0, 0, 210, 210);
}

joystickZone.addEventListener('touchstart', e => {
    joystickActive = true;
    const r = joystickZone.getBoundingClientRect();
    jcx = r.left + r.width/2; jcy = r.top + r.height/2;
    updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
}, { passive: false });
joystickZone.addEventListener('touchmove', e => {
    if (!joystickActive) return;
    e.preventDefault();
    updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
joystickZone.addEventListener('touchend',    resetJoystick);
joystickZone.addEventListener('touchcancel', resetJoystick);
joystickZone.addEventListener('mousedown', e => {
    joystickActive = true;
    const r = joystickZone.getBoundingClientRect();
    jcx = r.left + r.width/2; jcy = r.top + r.height/2;
    updateJoystick(e.clientX, e.clientY);
});
document.addEventListener('mousemove', e => { if (joystickActive) updateJoystick(e.clientX, e.clientY); });
document.addEventListener('mouseup',   () => { if (joystickActive) resetJoystick(); });

const KEY_ANGLES = {
    ArrowRight: 0, d: 0,
    ArrowDown: Math.PI/2, s: Math.PI/2,
    ArrowLeft: Math.PI, a: Math.PI,
    ArrowUp: -Math.PI/2, w: -Math.PI/2,
};
function handleKey(e) {
    if (e.key in KEY_ANGLES) {
        targetAngle = KEY_ANGLES[e.key];
        hasJoystickInput = true;
    }
    if (e.key === ' ') togglePause();
}

// ── INIT GAME ─────────────────────────────
function initGame(isLoaded) {
    showPage('gamePage');
    displayNameEl.textContent = currentPlayerName;
    scoreEl.textContent = score;
    isPaused = false;
    pauseOverlay.style.display = 'none';
    pauseBtn.textContent = '暂停';

    requestAnimationFrame(() => {
        calibrateCanvas();

        if (!isLoaded) {
            const name = nameInput.value.trim() || '玩家';
            currentPlayerName = name;
            playerChar = Array.from(name)[0] || '🐍';
            displayNameEl.textContent = currentPlayerName;
            score = 0; foodEatenCount = 0;
            scoreEl.textContent = 0;
            currentHeadColor = '#00d4aa';

            angle = Math.PI; 
            targetAngle = Math.PI;
            hasJoystickInput = false;
            snakeLength = 60;
            snakePoints = [];
            const cx = W / 2, cy = H / 2;
            for (let i = 0; i <= Math.ceil(snakeLength / SEGMENT_LEN) + 2; i++) {
                snakePoints.push({ x: cx + i * SEGMENT_LEN, y: cy });
            }
            spawnFood();
        } else {
            if (snakePoints && snakePoints.length > 0) {
                const dx = (W / 2) - snakePoints[0].x;
                const dy = (H / 2) - snakePoints[0].y;
                for (let i = 0; i < snakePoints.length; i++) {
                    snakePoints[i].x += dx;
                    snakePoints[i].y += dy;
                }
            }
        }

        gameRunning = true;
        if (rafId) cancelAnimationFrame(rafId);
        lastTime = performance.now();
        rafId = requestAnimationFrame(gameLoop);
    });
}

// ── GAME LOOP ─────────────────────────────
function gameLoop(now) {
    if (!gameRunning) return;
    rafId = requestAnimationFrame(gameLoop);
    if (isPaused) return;

    const dt = Math.min((now - lastTime) / 16.67, 1.5); 
    lastTime = now;

    update(dt);
    draw();
}

// ── UPDATE ────────────────────────────────
const TURN_SPEED = 0.12; 

function update(dt) {
    if (hasJoystickInput) {
        let diff = targetAngle - angle;
        while (diff >  Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const step = TURN_SPEED * dt;
        if (Math.abs(diff) < step) {
            angle = targetAngle;
        } else {
            angle += Math.sign(diff) * step;
        }
    }

    const head = snakePoints[0];
    const newHead = {
        x: head.x + Math.cos(angle) * snakeSpeed * dt,
        y: head.y + Math.sin(angle) * snakeSpeed * dt,
    };
    snakePoints.unshift(newHead);

    trimTrail();

    // 撞墙检测
    if (newHead.x < SNAKE_RADIUS + 1 || newHead.x > W - SNAKE_RADIUS - 1 ||
        newHead.y < SNAKE_RADIUS + 1 || newHead.y > H - SNAKE_RADIUS - 1) {
        handleGameOver(); return;
    }

    // 自撞检测 (固定跳过前 6 个脖子节点)
    const skipNodes = 6; 
    for (let i = skipNodes; i < snakePoints.length; i++) {
        const p = snakePoints[i];
        if (Math.hypot(newHead.x - p.x, newHead.y - p.y) < SNAKE_RADIUS * 1.1) {
            handleGameOver(); return;
        }
    }

    // 吃食物
    if (Math.hypot(newHead.x - food.x, newHead.y - food.y) < SNAKE_RADIUS + FOOD_RADIUS) {
        score += 10;
        foodEatenCount++;
        scoreEl.textContent = score;
        snakeLength += 30; 
        if (foodEatenCount % 5 === 0) triggerCombo();
        spawnFood();
    }
}

function trimTrail() {
    let total = 0;
    for (let i = 1; i < snakePoints.length; i++) {
        const prev = snakePoints[i-1], curr = snakePoints[i];
        total += Math.hypot(curr.x - prev.x, curr.y - prev.y);
        if (total >= snakeLength) {
            snakePoints.length = i + 1;
            break;
        }
    }
}

// ── DRAW ──────────────────────────────────
function draw() {
    ctx.fillStyle = '#0d0d1a';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    const spacing = 24;
    for (let x = spacing; x < W; x += spacing)
        for (let y = spacing; y < H; y += spacing) {
            ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI*2); ctx.fill();
        }

    const edgeDist = 18;
    const head = snakePoints[0];
    if (head.x < edgeDist || head.x > W-edgeDist || head.y < edgeDist || head.y > H-edgeDist) {
        const grad = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 60);
        grad.addColorStop(0, 'rgba(233,69,96,0.25)');
        grad.addColorStop(1, 'rgba(233,69,96,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
    }

    const pulse = 0.85 + 0.15 * Math.sin(performance.now() / 200);
    const foodGrad = ctx.createRadialGradient(food.x, food.y, 0, food.x, food.y, FOOD_RADIUS * pulse * 1.6);
    foodGrad.addColorStop(0, '#ff8fa3');
    foodGrad.addColorStop(0.5, '#e94560');
    foodGrad.addColorStop(1, 'rgba(233,69,96,0)');
    ctx.fillStyle = foodGrad;
    ctx.beginPath(); ctx.arc(food.x, food.y, FOOD_RADIUS * pulse * 1.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff6b8a';
    ctx.beginPath(); ctx.arc(food.x, food.y, FOOD_RADIUS * pulse, 0, Math.PI*2); ctx.fill();

    if (snakePoints.length < 2) return;

    let totalLen = 0;
    const dists = [0];
    for (let i = 1; i < snakePoints.length; i++) {
        totalLen += Math.hypot(snakePoints[i].x - snakePoints[i-1].x,
                               snakePoints[i].y - snakePoints[i-1].y);
        dists.push(totalLen);
    }

    for (let i = snakePoints.length - 2; i >= 0; i--) {
        const t = totalLen > 0 ? 1 - dists[i] / totalLen : 0; 
        const alpha = 0.25 + 0.75 * t;
        const radius = SNAKE_RADIUS * (0.35 + 0.65 * t);

        let color;
        if (isComboMode) {
            color = rainbowColors[Math.floor(i / 4) % rainbowColors.length];
        } else {
            color = i === 0 ? currentHeadColor : '#00d4aa';
        }

        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = radius * 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(snakePoints[i].x, snakePoints[i].y);
        ctx.lineTo(snakePoints[i+1].x, snakePoints[i+1].y);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;

    const hx = snakePoints[0].x, hy = snakePoints[0].y;
    const hGrad = ctx.createRadialGradient(hx - 2, hy - 2, 1, hx, hy, SNAKE_RADIUS + 3);
    hGrad.addColorStop(0, lighten(currentHeadColor));
    hGrad.addColorStop(1, currentHeadColor);
    ctx.fillStyle = hGrad;
    ctx.shadowColor = currentHeadColor; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(hx, hy, SNAKE_RADIUS + 2, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    const eyeOffset = SNAKE_RADIUS * 0.55;
    const perpAngle = angle + Math.PI/2;
    const eyeForward = SNAKE_RADIUS * 0.4;
    const eyeR = SNAKE_RADIUS * 0.3;
    [1, -1].forEach(side => {
        const ex = hx + Math.cos(angle) * eyeForward + Math.cos(perpAngle) * eyeOffset * side;
        const ey = hy + Math.sin(angle) * eyeForward + Math.sin(perpAngle) * eyeOffset * side;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(ex + Math.cos(angle)*eyeR*0.4, ey + Math.sin(angle)*eyeR*0.4,
            eyeR*0.55, 0, Math.PI*2); ctx.fill();
    });

    ctx.save();
    ctx.translate(hx + Math.cos(angle)*(SNAKE_RADIUS+10), hy + Math.sin(angle)*(SNAKE_RADIUS+10));
    ctx.rotate(angle);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.moveTo(6, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4);
    ctx.closePath(); ctx.fill();
    ctx.restore();
}

function lighten(hex) {
    let n = parseInt(hex.replace('#',''), 16);
    const r = Math.min(255, ((n >> 16) & 0xff) + 60);
    const g = Math.min(255, ((n >> 8) & 0xff) + 60);
    const b = Math.min(255, (n & 0xff) + 60);
    return `rgb(${r},${g},${b})`;
}

// ── FOOD ──────────────────────────────────
function spawnFood() {
    const margin = FOOD_RADIUS + 10;
    food.x = margin + Math.random() * (W - margin*2);
    food.y = margin + Math.random() * (H - margin*2);
}

// ── COMBO ─────────────────────────────────
function triggerCombo() {
    isComboMode = true;
    canvas.classList.add('combo-glow');
    comboText.textContent = `🔥 COMBO x${Math.floor(foodEatenCount/5)}!`;
    comboText.classList.add('show');
    currentHeadColor = headThemes[Math.floor(Math.random() * headThemes.length)];
    setTimeout(() => {
        canvas.classList.remove('combo-glow');
        comboText.classList.remove('show');
        isComboMode = false;
    }, 1200);
}

// ── PAUSE / EXIT ──────────────────────────
function togglePause() {
    if (!gameRunning) return;
    isPaused = !isPaused;
    pauseOverlay.style.display = isPaused ? 'flex' : 'none';
    pauseBtn.textContent = isPaused ? '继续' : '暂停';
    if (isPaused) { autoSaveGame(); lastTime = performance.now(); }
}

function exitGame() {
    if (confirm('退出游戏？当前进度将自动保存。')) {
        autoSaveGame();
        gameRunning = false;
        if (rafId) cancelAnimationFrame(rafId);
        showPage('menuPage');
        updateLeaderboardUI();
    }
}

// ── GAME OVER ─────────────────────────────
function handleGameOver() {
    gameRunning = false;
    if (rafId) cancelAnimationFrame(rafId);
    saveScore(currentPlayerName, score);
    updateLeaderboardUI();

    // 清除无效撞死残局存档，避免读档秒死
    localStorage.removeItem('snake360_saved');
    checkSavedGame();

    canvas.style.borderColor = '#e94560';
    canvas.style.boxShadow = '0 0 30px rgba(233,69,96,.8)';
    setTimeout(() => {
        canvas.style.borderColor = '';
        canvas.style.boxShadow = '';
        alert(`💥 游戏结束！\n${currentPlayerName} 得了 ${score} 分`);
        showPage('menuPage');
        updateLeaderboardUI();
    }, 300);
}

// ── SAVE / LOAD ───────────────────────────
function checkSavedGame() {
    loadBtn.disabled = !localStorage.getItem('snake360_saved');
}

function autoSaveGame() {
    localStorage.setItem('snake360_saved', JSON.stringify({
        snakePoints, snakeLength, angle, score, snakeSpeed,
        currentPlayerName, playerChar, foodEatenCount, currentHeadColor, food
    }));
    checkSavedGame();
}

function loadSavedGame() {
    const raw = localStorage.getItem('snake360_saved');
    if (!raw) return;
    const d = JSON.parse(raw);
    snakePoints = d.snakePoints; snakeLength = d.snakeLength;
    angle = d.angle; targetAngle = d.angle; hasJoystickInput = false;
    score = d.score; snakeSpeed = d.snakeSpeed || 3.5;
    currentPlayerName = d.currentPlayerName;
    playerChar = d.playerChar || Array.from(currentPlayerName)[0] || '🐍';
    foodEatenCount = d.foodEatenCount || 0;
    currentHeadColor = d.currentHeadColor || '#00d4aa';
    food = d.food;

    initGame(true);
}

// ── LEADERBOARD ───────────────────────────
function saveScore(name, sc) {
    let scores = JSON.parse(localStorage.getItem('snake_top3')) || [];
    scores.push({ name, score: sc });
    scores.sort((a,b) => b.score - a.score);
    localStorage.setItem('snake_top3', JSON.stringify(scores.slice(0,3)));
}

function updateLeaderboardUI() {
    const scores = JSON.parse(localStorage.getItem('snake_top3')) || [];
    const medals = ['🥇','🥈','🥉'];
    lbList.innerHTML = scores.length === 0
        ? '<li class="lb-item" style="justify-content:center;color:#8892a4;">暂无记录</li>'
        : '';
    scores.forEach((item, i) => {
        const li = document.createElement('li');
        li.className = 'lb-item';
        li.innerHTML = `<span><span class="lb-rank">${medals[i]}</span>${item.name}</span><span class="lb-score">${item.score} 分</span>`;
        lbList.appendChild(li);
    });
}

// ── PWA SERVICE WORKER REGISTRATION ───────
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('PWA ServiceWorker 注册成功:', reg.scope))
            .catch(err => console.log('PWA ServiceWorker 注册失败:', err));
    });
}
