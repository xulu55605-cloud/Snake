<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>贪吃蛇_千雨版</title>
    
    <!-- PWA 配置支持 -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --accent: #e94560;
            --accent2: #00d4aa;
            --text: #eaeaea;
            --muted: #8892a4;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; background: var(--bg);
            color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden; }

        /* ── PAGES ── */
        .page { position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 16px);
            opacity: 0; pointer-events: none; transition: opacity 0.25s; }
        .page.active { opacity: 1; pointer-events: all; }

        /* ── MENU ── */
        #menuPage { justify-content: center; gap: 20px; }
        .logo { font-size: 52px; line-height: 1; filter: drop-shadow(0 0 16px rgba(0,212,170,.5)); }
        .game-title { font-size: 28px; font-weight: 800; letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu-card { width: 100%; max-width: 360px; background: var(--surface);
            border: 1px solid rgba(255,255,255,.08); border-radius: 20px; padding: 20px;
            display: flex; flex-direction: column; gap: 16px; }
        .field-label { font-size: 12px; font-weight: 700; color: var(--muted);
            letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
        input[type="text"] { width: 100%; padding: 14px 16px;
            background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px; color: var(--text); font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: var(--accent2); }
        input[type="text"]::placeholder { color: var(--muted); }
        .speed-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
        .speed-btn { padding: 10px 4px; border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.04); border-radius: 10px;
            color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
        .speed-btn.active { background: var(--accent2); border-color: var(--accent2); color: #000; }
        .menu-btns { display: flex; flex-direction: column; gap: 10px; }
        .btn-primary { width: 100%; padding: 16px; border: none; border-radius: 14px;
            font-size: 17px; font-weight: 700; cursor: pointer;
            background: linear-gradient(135deg, var(--accent2), #00b894);
            color: #000; box-shadow: 0 4px 20px rgba(0,212,170,.3); }
        .btn-secondary { width: 100%; padding: 14px; border: 1px solid rgba(255,255,255,.15);
            border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
            background: transparent; color: var(--text); }
        .btn-secondary:disabled { opacity: 0.3; cursor: not-allowed; }
        .lb-section { width: 100%; max-width: 360px; }
        .lb-title { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 1px;
            text-transform: uppercase; margin-bottom: 10px; text-align: center; }
        .lb-list { display: flex; flex-direction: column; gap: 6px; }
        .lb-item { display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; background: var(--surface);
            border: 1px solid rgba(255,255,255,.06); border-radius: 10px; font-size: 14px; }
        .lb-rank { font-weight: 800; margin-right: 10px; }
        .lb-score { font-weight: 700; color: var(--accent2); }

        /* ── GAME PAGE ── */
        #gamePage { padding: 0; gap: 0; justify-content: flex-start; }
        .hud { width: 100%; padding: calc(var(--safe-top) + 10px) 16px 10px;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface); border-bottom: 1px solid rgba(255,255,255,.06); flex-shrink: 0; }
        .hud-player { font-size: 13px; font-weight: 700; color: var(--accent2); }
        .hud-score { font-size: 22px; font-weight: 800; }
        .hud-actions { display: flex; gap: 8px; }
        .hud-btn { padding: 7px 14px; border-radius: 8px; font-size: 13px;
            font-weight: 700; border: none; cursor: pointer; }
        .hud-pause { background: rgba(255,255,255,.12); color: var(--text); }
        .hud-exit  { background: rgba(233,69,96,.2); color: var(--accent); }

        .canvas-wrap { flex: 1; width: 100%; display: flex; align-items: center;
            justify-content: center; padding: 8px; position: relative; overflow: hidden; }
        canvas { display: block; border-radius: 14px;
            border: 2px solid rgba(255,255,255,.08); touch-action: none; background: #0d0d1a; }

        /* Pause overlay */
        .overlay { position: absolute; inset: 0; background: rgba(10,10,25,.88);
            backdrop-filter: blur(6px); display: none; flex-direction: column;
            justify-content: center; align-items: center; gap: 20px;
            border-radius: 14px; z-index: 20; }
        .overlay h2 { font-size: 22px; font-weight: 800; }
        .overlay-btn { padding: 14px 36px; border-radius: 14px; font-size: 17px;
            font-weight: 700; border: none; cursor: pointer;
            background: var(--accent2); color: #000; }

        /* ── JOYSTICK ── */
        .joystick-area { flex-shrink: 0; width: 100%; display: flex;
            justify-content: center; align-items: center;
            padding-bottom: calc(var(--safe-bottom) + 14px); padding-top: 6px;
            background: var(--bg); }

        .joystick-zone { position: relative; width: 210px; height: 210px;
            background: var(--surface); border-radius: 50%;
            border: 2px solid rgba(255,255,255,.1);
            display: flex; justify-content: center; align-items: center;
            touch-action: none;
            box-shadow: 0 4px 28px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07); }

        .joystick-zone::before {
            content: '';
            position: absolute; inset: 8px;
            border-radius: 50%;
            border: 1px dashed rgba(255,255,255,.08);
            pointer-events: none;
        }

        .j-label { position: absolute; font-size: 12px; color: rgba(255,255,255,.22);
            pointer-events: none; font-weight: 700; }
        .j-n { top: 10px; }
        .j-s { bottom: 10px; }
        .j-w { left: 10px; }
        .j-e { right: 10px; }

        .joystick-handle { position: absolute; width: 86px; height: 86px;
            background: radial-gradient(circle at 35% 35%, #00e5b8, var(--accent2));
            border-radius: 50%;
            box-shadow: 0 4px 18px rgba(0,212,170,.55);
            transition: transform 0.04s ease-out;
            pointer-events: none; display: flex; justify-content: center;
            align-items: center; color: rgba(0,0,0,.45); font-size: 24px; }

        #dirCanvas { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }

        /* Combo */
        .combo-text { position: absolute; top: 38%; left: 50%;
            transform: translate(-50%,-50%) scale(0.5); font-size: 28px; font-weight: 900;
            background: linear-gradient(45deg,#ff2d55,#ffcc00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            pointer-events: none; opacity: 0; z-index: 10; white-space: nowrap;
            transition: all .45s cubic-bezier(.175,.885,.32,1.275); }
        .combo-text.show { opacity: 1; transform: translate(-50%,-70%) scale(1.15); }

        canvas.combo-glow { animation: comboPulse .6s ease-in-out 2; }
        @keyframes comboPulse {
            0%   { border-color: var(--accent); box-shadow: 0 0 24px rgba(233,69,96,.7); }
            50%  { border-color: #ffcc00;       box-shadow: 0 0 30px rgba(255,204,0,.8); }
            100% { border-color: rgba(255,255,255,.08); box-shadow: none; }
        }
    </style>
</head>
<body>

<!-- MENU -->
<div class="page active" id="menuPage">
    <div class="logo">🐍</div>
    <div class="game-title">贪吃蛇_千雨版</div>
    <div class="menu-card">
        <div>
            <div class="field-label">玩家名字</div>
            <input type="text" id="playerName" placeholder="输入名字" maxlength="10">
        </div>
        <div>
            <div class="field-label">速度</div>
            <div class="speed-grid">
                <button class="speed-btn" data-speed="1.5">极慢</button>
                <button class="speed-btn" data-speed="2.5">慢速</button>
                <button class="speed-btn active" data-speed="3.0">中速</button>
                <button class="speed-btn" data-speed="4.5">快速</button>
            </div>
        </div>
        <div class="menu-btns">
            <button class="btn-primary" id="startBtn">开始游戏</button>
            <button class="btn-secondary" id="loadBtn" disabled>读取存档</button>
        </div>
    </div>
    <div class="lb-section">
        <div class="lb-title">🏆 历史最佳</div>
        <ul class="lb-list" id="leaderboardList"></ul>
    </div>
</div>

<!-- GAME -->
<div class="page" id="gamePage">
    <div class="hud">
        <div>
            <div class="hud-player" id="displayName">玩家</div>
            <div class="hud-score"><span id="currentScore">0</span> 分</div>
        </div>
        <div style="text-align:center;">
            <div style="font-size:11px;font-weight:700;color:#ff6b35;letter-spacing:1px;">🤖 AI</div>
            <div style="font-size:16px;font-weight:800;color:#ff6b35;"><span id="aiScore">0</span> 分</div>
        </div>
        <div class="hud-actions">
            <button class="hud-btn hud-pause" id="pauseBtn">暂停</button>
            <button class="hud-btn hud-exit"  id="exitBtn">退出</button>
        </div>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
        <div class="combo-text" id="comboText">🔥 COMBO!</div>
        <canvas id="gameCanvas"></canvas>
        <div class="overlay" id="pauseOverlay">
            <h2>⏸ 已暂停</h2>
            <button class="overlay-btn" id="resumeBtn">继续游戏</button>
        </div>
    </div>
    <div class="joystick-area">
        <div class="joystick-zone" id="joystickZone">
            <span class="j-label j-n">N</span>
            <span class="j-label j-s">S</span>
            <span class="j-label j-w">W</span>
            <span class="j-label j-e">E</span>
            <canvas id="dirCanvas" width="210" height="210"></canvas>
            <div class="joystick-handle" id="joystickHandle">✽</div>
        </div>
    </div>
</div>

<script>
// ── ELEMENTS ──────────────────────────────
const canvas       = document.getElementById('gameCanvas');
const ctx          = canvas.getContext('2d');
const dirCanvas    = document.getElementById('dirCanvas');
const dctx         = dirCanvas.getContext('2d');
const scoreEl      = document.getElementById('currentScore');
const aiScoreEl    = document.getElementById('aiScore');
const displayNameEl= document.getElementById('displayName');
const nameInput    = document.getElementById('playerName');
const startBtn     = document.getElementById('startBtn');
const loadBtn      = document.getElementById('loadBtn');
const pauseBtn     = document.getElementById('pauseBtn');
const resumeBtn    = document.getElementById('resumeBtn');
const exitBtn      = document.getElementById('exitBtn');
const speedBtns    = document.querySelectorAll('.speed-btn');
const lbList       = document.getElementById('leaderboardList');
const menuPage     = document.getElementById('menuPage');
const gamePage     = document.getElementById('gamePage');
const pauseOverlay = document.getElementById('pauseOverlay');
const comboText    = document.getElementById('comboText');
const joystickZone = document.getElementById('joystickZone');
const joystickHandle = document.getElementById('joystickHandle');

// ── CANVAS CALIBRATION ────────────────────
let W = 320, H = 320;

function calibrateCanvas() {
    const HUD_H = 72, STICK_H = 234;
    const availH = window.innerHeight - HUD_H - STICK_H - 16;
    const availW = window.innerWidth - 16;
    const side = Math.min(availH, availW, 480);
    W = H = Math.max(240, side);
    canvas.width  = W; canvas.height = H;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
}
calibrateCanvas();
window.addEventListener('resize', () => { calibrateCanvas(); });

// ── 360° SNAKE CORE ───────────────────────
const SNAKE_SPEED_DEFAULT = 3.5;   
const SNAKE_RADIUS = 5.6;        
const FOOD_RADIUS  = 9;
const SEGMENT_LEN  = SNAKE_RADIUS * 2.2; 

const rainbowColors = ['#ff2d55','#ff9500','#ffcc00','#34c759','#007aff','#af52de'];
const headThemes    = ['#00d4aa','#af52de','#ff2d55','#5856d6','#ff9500','#00c7be'];

// Game state
let snakePoints = [];  
let snakeLength = 60;  
let angle      = 0;    
let snakeSpeed = SNAKE_SPEED_DEFAULT;
let food       = { x: 100, y: 100, type: 0 };

// 食物类型定义：形状、颜色主题
const FOOD_TYPES = [
    { name: 'apple',    color1: '#ff6b8a', color2: '#e94560', glow: '#ff2d55',   shape: 'circle'  },
    { name: 'star',     color1: '#ffe066', color2: '#ff9500', glow: '#ffcc00',   shape: 'star'    },
    { name: 'diamond',  color1: '#66d9ff', color2: '#007aff', glow: '#00c7be',   shape: 'diamond' },
    { name: 'triangle', color1: '#b8f5a0', color2: '#34c759', glow: '#00d4aa',   shape: 'triangle'},
    { name: 'gem',      color1: '#e0aaff', color2: '#af52de', glow: '#bf5af2',   shape: 'hexagon' },
    { name: 'fire',     color1: '#ffb347', color2: '#ff4500', glow: '#ff6200',   shape: 'circle'  },
];
let score      = 0, foodEatenCount = 0;
let isComboMode = false;
let currentHeadColor = '#00d4aa';
let currentPlayerName = '', playerChar = '🐍';
let gameRunning = false, isPaused = false;
let rafId = null;
let lastTime = 0;
let invincibleTimer = 0; // 🛡️ 读档无敌保护机制
let eggFood = null; // 彩蛋食物（随机出现）

// ── AI 蛇 ─────────────────────────────────
const AI_SPEED        = 1.2;   // 非常缓慢
const AI_RADIUS       = SNAKE_RADIUS * 0.9;
const AI_TURN_SPEED   = 0.055; // 转向迟缓，行为更笨拙
const AI_COLOR_BODY   = '#ff6b35';
const AI_COLOR_HEAD   = '#ff3b00';
let aiSnake = {
    points: [],
    length: 50,
    angle:  0,
    target: 0,   // 目标朝向
    score:  0,
    active: false,
    // 避障计时器：撞到边界时触发一小段随机逃跑
    wanderTimer: 0,
    wanderAngle: 0,
};

// ── SPEED BUTTONS ─────────────────────────
speedBtns.forEach(btn => btn.addEventListener('click', () => {
    speedBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    snakeSpeed = parseFloat(btn.dataset.speed);
}));

// ── PAGE SWITCH ───────────────────────────
function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'menuPage') {
        checkSavedGame(); // 返回主菜单时强制刷新读档按钮状态
    }
}

// ── BUTTONS ───────────────────────────────
startBtn.addEventListener('click', () => initGame(false));
loadBtn.addEventListener('click',  loadSavedGame);
pauseBtn.addEventListener('click', togglePause);
resumeBtn.addEventListener('click', togglePause);
exitBtn.addEventListener('click',  exitGame);
document.addEventListener('keydown', handleKey);

// 网页加载时立即进行检查
checkSavedGame(); 
updateLeaderboardUI();

// ── JOYSTICK ──────────────────────────────
let jcx = 0, jcy = 0;
const MAX_RADIUS = 70;

function updateJoystick(cx, cy) {
    const dx = cx - jcx, dy = cy - jcy;
    const dist = Math.hypot(dx, dy);

    const clamped = Math.min(dist, MAX_RADIUS);
    const ang = Math.atan2(dy, dx);
    const hx = Math.cos(ang) * clamped;
    const hy = Math.sin(ang) * clamped;
    joystickHandle.style.transform = `translate(${hx}px,${hy}px)`;

    if (dist > 12) {
        targetAngle = ang;
        hasJoystickInput = true;
        drawDirArc(ang);
    } else {
        hasJoystickInput = false;
        clearDirArc();
    }
}

function resetJoystick() {
    joystickActive = false;
    hasJoystickInput = false;
    joystickHandle.style.transform = 'translate(0,0)';
    clearDirArc();
}

function drawDirArc(ang) {
    const sz = 210;
    dctx.clearRect(0, 0, sz, sz);
    const cx = sz/2, cy = sz/2, r = sz/2 - 6;
    dctx.save();
    dctx.strokeStyle = 'rgba(0,212,170,0.35)';
    dctx.lineWidth = 3;
    dctx.shadowColor = '#00d4aa';
    dctx.shadowBlur = 8;
    dctx.beginPath();
    dctx.arc(cx, cy, r, ang - 0.25, ang + 0.25);
    dctx.stroke();
    dctx.fillStyle = '#00d4aa';
    dctx.shadowBlur = 12;
    dctx.beginPath();
    dctx.arc(cx + Math.cos(ang)*r, cy + Math.sin(ang)*r, 5, 0, Math.PI*2);
    dctx.fill();
    dctx.restore();
}

function clearDirArc() {
    dctx.clearRect(0, 0, 210, 210);
}

joystickZone.addEventListener('touchstart', e => {
    joystickActive = true;
    const r = joystickZone.getBoundingClientRect();
    jcx = r.left + r.width/2; jcy = r.top + r.height/2;
    updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
}, { passive: false });
joystickZone.addEventListener('touchmove', e => {
    if (!joystickActive) return;
    e.preventDefault();
    updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
joystickZone.addEventListener('touchend',    resetJoystick);
joystickZone.addEventListener('touchcancel', resetJoystick);
joystickZone.addEventListener('mousedown', e => {
    joystickActive = true;
    const r = joystickZone.getBoundingClientRect();
    jcx = r.left + r.width/2; jcy = r.top + r.height/2;
    updateJoystick(e.clientX, e.clientY);
});
document.addEventListener('mousemove', e => { if (joystickActive) updateJoystick(e.clientX, e.clientY); });
document.addEventListener('mouseup',   () => { if (joystickActive) resetJoystick(); });

const KEY_ANGLES = {
    ArrowRight: 0, d: 0,
    ArrowDown: Math.PI/2, s: Math.PI/2,
    ArrowLeft: Math.PI, a: Math.PI,
    ArrowUp: -Math.PI/2, w: -Math.PI/2,
};
function handleKey(e) {
    if (e.key in KEY_ANGLES) {
        targetAngle = KEY_ANGLES[e.key];
        hasJoystickInput = true;
    }
    if (e.key === ' ') togglePause();
}

// ── INIT GAME ─────────────────────────────
function initGame(isLoaded) {
    showPage('gamePage');
    displayNameEl.textContent = currentPlayerName || '玩家';
    scoreEl.textContent = score;
    isPaused = false;
    pauseOverlay.style.display = 'none';
    pauseBtn.textContent = '暂停';

    requestAnimationFrame(() => {
        calibrateCanvas();

        if (!isLoaded) {
            const name = nameInput.value.trim() || '玩家';
            currentPlayerName = name;
            playerChar = Array.from(name)[0] || '🐍';
            displayNameEl.textContent = currentPlayerName;
            score = 0; foodEatenCount = 0;
            scoreEl.textContent = 0;
            aiScoreEl.textContent = 0;
            currentHeadColor = '#00d4aa';
            invincibleTimer = 0;
            eggFood = null;

            angle = Math.PI; 
            targetAngle = Math.PI;
            hasJoystickInput = false;
            snakeLength = 60;
            snakePoints = [];
            const cx = W / 2, cy = H / 2;
            for (let i = 0; i <= Math.ceil(snakeLength / SEGMENT_LEN) + 2; i++) {
                snakePoints.push({ x: cx + i * SEGMENT_LEN, y: cy });
            }
            spawnFood();
            initAiSnake();
            autoSaveGame(); // ⚡ 开局即存档一次
        } else {
            // 💡【读档终极安全防护】：
            // 将蛇身体拉直沿着头部背向反展开，彻底杜绝任何弯曲重叠导致的秒死
            if (snakePoints && snakePoints.length > 0) {
                const head = { ...snakePoints[0] };
                const numPoints = snakePoints.length;
                snakePoints = [];
                for (let i = 0; i < numPoints; i++) {
                    snakePoints.push({
                        x: head.x - Math.cos(angle) * (i * SEGMENT_LEN),
                        y: head.y - Math.sin(angle) * (i * SEGMENT_LEN)
                    });
                }
            }
            invincibleTimer = 90; // 开启 1.5 秒（90帧）强力无敌保护
        }

        gameRunning = true;
        if (rafId) cancelAnimationFrame(rafId);
        lastTime = performance.now();
        initAiSnake();
        rafId = requestAnimationFrame(gameLoop);
    });
}

// ── GAME LOOP ─────────────────────────────
function gameLoop(now) {
    if (!gameRunning) return;
    rafId = requestAnimationFrame(gameLoop);
    if (isPaused) return;

    const dt = Math.min((now - lastTime) / 16.67, 1.5); 
    lastTime = now;

    if (invincibleTimer > 0) invincibleTimer--;

    update(dt);
    updateAiSnake(dt);
    draw();
}

// ── UPDATE ────────────────────────────────
const TURN_SPEED = 0.12; 

function update(dt) {
    if (hasJoystickInput) {
        let diff = targetAngle - angle;
        while (diff >  Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const step = TURN_SPEED * dt;
        if (Math.abs(diff) < step) {
            angle = targetAngle;
        } else {
            angle += Math.sign(diff) * step;
        }
    }

    const head = snakePoints[0];
    const newHead = {
        x: head.x + Math.cos(angle) * snakeSpeed * dt,
        y: head.y + Math.sin(angle) * snakeSpeed * dt,
    };
    snakePoints.unshift(newHead);

    trimTrail();

    // 撞墙检测
    if (newHead.x < SNAKE_RADIUS + 1 || newHead.x > W - SNAKE_RADIUS - 1 ||
        newHead.y < SNAKE_RADIUS + 1 || newHead.y > H - SNAKE_RADIUS - 1) {
        handleGameOver(); return;
    }

    // 吃食物
    if (Math.hypot(newHead.x - food.x, newHead.y - food.y) < SNAKE_RADIUS + FOOD_RADIUS) {
        foodEatenCount++;
        const tier = Math.ceil(foodEatenCount / 10);
        const pts = tier * 5;
        score += pts;
        scoreEl.textContent = score;
        snakeLength += 30;
        showFloatingScore(food.x, food.y, pts);
        if (foodEatenCount % 5 === 0) triggerCombo();
        spawnFood();
        maybeSpawnEgg(); // 每次吃完普通食物后，有1/15概率生成彩蛋
        autoSaveGame();
    }

    // 吃彩蛋食物
    if (eggFood && Math.hypot(newHead.x - eggFood.x, newHead.y - eggFood.y) < SNAKE_RADIUS + FOOD_RADIUS * 1.4) {
        score += 500;
        scoreEl.textContent = score;
        snakeLength += 80;
        showFloatingScore(eggFood.x, eggFood.y, 500, true);
        eggFood = null;
    }
}

function trimTrail() {
    let total = 0;
    for (let i = 1; i < snakePoints.length; i++) {
        const prev = snakePoints[i-1], curr = snakePoints[i];
        total += Math.hypot(curr.x - prev.x, curr.y - prev.y);
        if (total >= snakeLength) {
            snakePoints.length = i + 1;
            break;
        }
    }
}

// ── DRAW ──────────────────────────────────
function draw() {
    ctx.fillStyle = '#0d0d1a';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    const spacing = 24;
    for (let x = spacing; x < W; x += spacing)
        for (let y = spacing; y < H; y += spacing) {
            ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI*2); ctx.fill();
        }

    const edgeDist = 18;
    const head = snakePoints[0];
    if (head.x < edgeDist || head.x > W-edgeDist || head.y < edgeDist || head.y > H-edgeDist) {
        const grad = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 60);
        grad.addColorStop(0, 'rgba(233,69,96,0.25)');
        grad.addColorStop(1, 'rgba(233,69,96,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
    }

    if (snakePoints.length < 2) return;

    let totalLen = 0;
    const dists = [0];
    for (let i = 1; i < snakePoints.length; i++) {
        totalLen += Math.hypot(snakePoints[i].x - snakePoints[i-1].x,
                               snakePoints[i].y - snakePoints[i-1].y);
        dists.push(totalLen);
    }

    for (let i = snakePoints.length - 2; i >= 0; i--) {
        const t = totalLen > 0 ? 1 - dists[i] / totalLen : 0; 
        const alpha = (invincibleTimer > 0 && Math.floor(invincibleTimer / 4) % 2 === 0) ? 0.3 : (0.25 + 0.75 * t);
        const radius = SNAKE_RADIUS * (0.35 + 0.65 * t);

        let color;
        if (isComboMode) {
            color = rainbowColors[Math.floor(i / 4) % rainbowColors.length];
        } else {
            color = i === 0 ? currentHeadColor : '#00d4aa';
        }

        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = radius * 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(snakePoints[i].x, snakePoints[i].y);
        ctx.lineTo(snakePoints[i+1].x, snakePoints[i+1].y);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;

    const hx = snakePoints[0].x, hy = snakePoints[0].y;
    const hGrad = ctx.createRadialGradient(hx - 2, hy - 2, 1, hx, hy, SNAKE_RADIUS + 3);
    hGrad.addColorStop(0, lighten(currentHeadColor));
    hGrad.addColorStop(1, currentHeadColor);
    ctx.fillStyle = hGrad;
    ctx.shadowColor = currentHeadColor; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(hx, hy, SNAKE_RADIUS + 2, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    const eyeOffset = SNAKE_RADIUS * 0.55;
    const perpAngle = angle + Math.PI/2;
    const eyeForward = SNAKE_RADIUS * 0.4;
    const eyeR = SNAKE_RADIUS * 0.3;
    [1, -1].forEach(side => {
        const ex = hx + Math.cos(angle) * eyeForward + Math.cos(perpAngle) * eyeOffset * side;
        const ey = hy + Math.sin(angle) * eyeForward + Math.sin(perpAngle) * eyeOffset * side;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(ex + Math.cos(angle)*eyeR*0.4, ey + Math.sin(angle)*eyeR*0.4,
            eyeR*0.55, 0, Math.PI*2); ctx.fill();
    });

    ctx.save();
    ctx.translate(hx + Math.cos(angle)*(SNAKE_RADIUS+10), hy + Math.sin(angle)*(SNAKE_RADIUS+10));
    ctx.rotate(angle);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.moveTo(6, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // 蛇头上显示玩家首字符（始终朝上，不随蛇头方向旋转）
    const initial = Array.from(currentPlayerName || '?')[0] || '?';
    const fontSize = Math.round((SNAKE_RADIUS + 2) * 1.6);
    ctx.save();
    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#fff';
    ctx.fillText(initial, hx, hy);
    ctx.restore();

    drawAiSnake();
    drawFood();
    drawEggFood();
    drawFloatingScores();
}

// ── DRAW FOOD ─────────────────────────────
function drawFood() {
    const ft = FOOD_TYPES[food.type] || FOOD_TYPES[0];
    const pulse = 0.85 + 0.15 * Math.sin(performance.now() / 200);
    const r = FOOD_RADIUS * pulse;
    const fx = food.x, fy = food.y;

    // 光晕
    const glowGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, r * 2.2);
    glowGrad.addColorStop(0, ft.glow + '55');
    glowGrad.addColorStop(1, ft.glow + '00');
    ctx.fillStyle = glowGrad;
    ctx.beginPath(); ctx.arc(fx, fy, r * 2.2, 0, Math.PI*2); ctx.fill();

    ctx.save();
    ctx.shadowColor = ft.glow;
    ctx.shadowBlur = 14;

    // 渐变填充色
    const grad = ctx.createRadialGradient(fx - r*0.3, fy - r*0.3, r*0.1, fx, fy, r);
    grad.addColorStop(0, ft.color1);
    grad.addColorStop(1, ft.color2);
    ctx.fillStyle = grad;

    const t = performance.now() / 1000;

    if (ft.shape === 'circle') {
        ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI*2); ctx.fill();
        // 高光
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath(); ctx.arc(fx - r*0.28, fy - r*0.28, r*0.28, 0, Math.PI*2); ctx.fill();

    } else if (ft.shape === 'star') {
        ctx.translate(fx, fy);
        ctx.rotate(t * 0.8);
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            const a1 = (i * 4 * Math.PI / 5) - Math.PI/2;
            const a2 = ((i * 4 + 2) * Math.PI / 5) - Math.PI/2;
            if (i === 0) ctx.moveTo(Math.cos(a1)*r, Math.sin(a1)*r);
            else ctx.lineTo(Math.cos(a1)*r, Math.sin(a1)*r);
            ctx.lineTo(Math.cos(a2)*r*0.45, Math.sin(a2)*r*0.45);
        }
        ctx.closePath(); ctx.fill();

    } else if (ft.shape === 'diamond') {
        ctx.translate(fx, fy);
        ctx.rotate(t * 0.5);
        ctx.beginPath();
        ctx.moveTo(0, -r*1.1);
        ctx.lineTo(r*0.7, 0);
        ctx.lineTo(0, r*1.1);
        ctx.lineTo(-r*0.7, 0);
        ctx.closePath(); ctx.fill();
        // 内部高光线
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -r*1.1); ctx.lineTo(r*0.7, 0);
        ctx.stroke();

    } else if (ft.shape === 'triangle') {
        ctx.translate(fx, fy);
        ctx.rotate(t * 0.6);
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
            const a = (i * 2 * Math.PI / 3) - Math.PI/2;
            if (i === 0) ctx.moveTo(Math.cos(a)*r*1.1, Math.sin(a)*r*1.1);
            else ctx.lineTo(Math.cos(a)*r*1.1, Math.sin(a)*r*1.1);
        }
        ctx.closePath(); ctx.fill();

    } else if (ft.shape === 'hexagon') {
        ctx.translate(fx, fy);
        ctx.rotate(t * 0.4);
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const a = (i * Math.PI / 3);
            if (i === 0) ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
            else ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
        }
        ctx.closePath(); ctx.fill();
        // 内六边形
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const a = (i * Math.PI / 3);
            if (i === 0) ctx.moveTo(Math.cos(a)*r*0.5, Math.sin(a)*r*0.5);
            else ctx.lineTo(Math.cos(a)*r*0.5, Math.sin(a)*r*0.5);
        }
        ctx.closePath(); ctx.fill();
    }

    ctx.restore();
}

function lighten(hex) {
    let n = parseInt(hex.replace('#',''), 16);
    const r = Math.min(255, ((n >> 16) & 0xff) + 60);
    const g = Math.min(255, ((n >> 8) & 0xff) + 60);
    const b = Math.min(255, (n & 0xff) + 60);
    return `rgb(${r},${g},${b})`;
}

// ── FLOATING SCORE TEXT ───────────────────
const floatingScores = [];
function showFloatingScore(x, y, pts, isEgg = false) {
    floatingScores.push({ x, y, pts, isEgg, life: isEgg ? 90 : 60, vy: isEgg ? -1.8 : -1.2 });
}
function drawFloatingScores() {
    for (let i = floatingScores.length - 1; i >= 0; i--) {
        const fs = floatingScores[i];
        const maxLife = fs.isEgg ? 90 : 60;
        const alpha = fs.life / maxLife;
        ctx.save();
        ctx.globalAlpha = alpha;
        if (fs.isEgg) {
            const scale = 1 + (1 - alpha) * 0.5;
            ctx.translate(fs.x, fs.y);
            ctx.scale(scale, scale);
            ctx.font = `bold 20px sans-serif`;
            ctx.textAlign = 'center';
            ctx.shadowColor = '#ffcc00';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#ffcc00';
            ctx.fillText(`🥚 +500`, 0, 0);
        } else {
            ctx.font = `bold ${14 + Math.floor(fs.pts/5)}px sans-serif`;
            ctx.fillStyle = fs.pts >= 15 ? '#ffcc00' : fs.pts >= 10 ? '#00d4aa' : '#ff8fa3';
            ctx.textAlign = 'center';
            ctx.fillText(`+${fs.pts}`, fs.x, fs.y);
        }
        ctx.restore();
        fs.y += fs.vy;
        fs.life--;
        if (fs.life <= 0) floatingScores.splice(i, 1);
    }
}

// ── FOOD ──────────────────────────────────
function spawnFood() {
    const innerW = W * 0.8;
    const innerH = H * 0.8;
    const offsetX = (W - innerW) / 2;
    const offsetY = (H - innerH) / 2;
    food.x = offsetX + Math.random() * innerW;
    food.y = offsetY + Math.random() * innerH;
    food.type = Math.floor(Math.random() * FOOD_TYPES.length);
}

function maybeSpawnEgg() {
    if (eggFood) return;
    if (Math.random() < 1 / 15) {
        const innerW = W * 0.8;
        const innerH = H * 0.8;
        const offsetX = (W - innerW) / 2;
        const offsetY = (H - innerH) / 2;
        eggFood = {
            x: offsetX + Math.random() * innerW,
            y: offsetY + Math.random() * innerH,
        };
    }
}

// ── AI 蛇逻辑 ─────────────────────────────
function initAiSnake() {
    // 出生在玩家对角附近，避免重叠
    const margin = 40;
    const px = snakePoints[0]?.x ?? W / 2;
    const py = snakePoints[0]?.y ?? H / 2;
    // 选一个远离玩家的角落区域
    const corners = [
        { x: margin + Math.random() * W * 0.25, y: margin + Math.random() * H * 0.25 },
        { x: W * 0.75 + Math.random() * W * 0.2, y: margin + Math.random() * H * 0.25 },
        { x: margin + Math.random() * W * 0.25, y: H * 0.75 + Math.random() * H * 0.2 },
        { x: W * 0.75 + Math.random() * W * 0.2, y: H * 0.75 + Math.random() * H * 0.2 },
    ];
    corners.sort((a, b) =>
        Math.hypot(b.x - px, b.y - py) - Math.hypot(a.x - px, a.y - py)
    );
    const start = corners[0];
    start.x = Math.max(margin, Math.min(W - margin, start.x));
    start.y = Math.max(margin, Math.min(H - margin, start.y));

    aiSnake.angle  = Math.random() * Math.PI * 2;
    aiSnake.target = aiSnake.angle;
    aiSnake.length = 50;
    aiSnake.score  = 0;
    aiSnake.wanderTimer = 0;
    aiSnake.points = [];
    for (let i = 0; i <= Math.ceil(aiSnake.length / SEGMENT_LEN) + 2; i++) {
        aiSnake.points.push({
            x: start.x - Math.cos(aiSnake.angle) * i * SEGMENT_LEN,
            y: start.y - Math.sin(aiSnake.angle) * i * SEGMENT_LEN,
        });
    }
    aiSnake.active = true;
}

function updateAiSnake(dt) {
    if (!aiSnake.active || aiSnake.points.length < 1) return;

    const head = aiSnake.points[0];
    const WALL_MARGIN = 28;

    // ── AI 决策：选择追逐目标 ────────────────
    // 优先彩蛋，其次普通食物
    let targetX = food.x, targetY = food.y;
    if (eggFood) {
        const dEgg = Math.hypot(head.x - eggFood.x, head.y - eggFood.y);
        const dFood = Math.hypot(head.x - food.x, head.y - food.y);
        if (dEgg < dFood * 1.8) { targetX = eggFood.x; targetY = eggFood.y; }
    }

    // 判断是否正在紧贴墙壁，触发随机逃跑
    const nearWall = head.x < WALL_MARGIN || head.x > W - WALL_MARGIN ||
                     head.y < WALL_MARGIN || head.y > H - WALL_MARGIN;

    if (nearWall && aiSnake.wanderTimer <= 0) {
        // 转向画布中心偏移一个随机角
        const toCenterAngle = Math.atan2(H / 2 - head.y, W / 2 - head.x);
        aiSnake.wanderAngle = toCenterAngle + (Math.random() - 0.5) * Math.PI * 0.6;
        aiSnake.wanderTimer = 40 + Math.random() * 30;
    }

    if (aiSnake.wanderTimer > 0) {
        aiSnake.target = aiSnake.wanderAngle;
        aiSnake.wanderTimer--;
    } else {
        // 朝食物转向，但加入一点随机漂移让行为不那么机械
        const rawAngle = Math.atan2(targetY - head.y, targetX - head.x);
        const drift = (Math.random() - 0.5) * 0.08;
        aiSnake.target = rawAngle + drift;
    }

    // 平滑转向
    let diff = aiSnake.target - aiSnake.angle;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const step = AI_TURN_SPEED * dt;
    aiSnake.angle += Math.abs(diff) < step ? diff : Math.sign(diff) * step;

    // 移动
    const newHead = {
        x: head.x + Math.cos(aiSnake.angle) * AI_SPEED * dt,
        y: head.y + Math.sin(aiSnake.angle) * AI_SPEED * dt,
    };
    aiSnake.points.unshift(newHead);

    // 裁剪尾巴
    let total = 0;
    for (let i = 1; i < aiSnake.points.length; i++) {
        const p = aiSnake.points[i], q = aiSnake.points[i - 1];
        total += Math.hypot(p.x - q.x, p.y - q.y);
        if (total >= aiSnake.length) { aiSnake.points.length = i + 1; break; }
    }

    // AI 碰墙 → 重生（不影响玩家）
    if (newHead.x < AI_RADIUS || newHead.x > W - AI_RADIUS ||
        newHead.y < AI_RADIUS || newHead.y > H - AI_RADIUS) {
        // 短暂延迟后重生
        aiSnake.active = false;
        setTimeout(() => { if (gameRunning && !isPaused) initAiSnake(); }, 1200);
        return;
    }

    // AI 吃普通食物
    if (Math.hypot(newHead.x - food.x, newHead.y - food.y) < AI_RADIUS + FOOD_RADIUS) {
        aiSnake.score += 5;
        aiSnake.length += 20;
        aiScoreEl.textContent = aiSnake.score;
        spawnFood();
        maybeSpawnEgg();
        showAiScorePopup(food.x, food.y);
    }

    // AI 吃彩蛋
    if (eggFood && Math.hypot(newHead.x - eggFood.x, newHead.y - eggFood.y) < AI_RADIUS + FOOD_RADIUS * 1.4) {
        aiSnake.score += 100;
        aiSnake.length += 40;
        aiScoreEl.textContent = aiSnake.score;
        showAiScorePopup(eggFood.x, eggFood.y, true);
        eggFood = null;
    }
}

// AI 得分小提示（用不同颜色区别于玩家）
const aiPopups = [];
function showAiScorePopup(x, y, isEgg = false) {
    aiPopups.push({ x, y, isEgg, life: 50, vy: -1.0 });
}

function drawAiSnake() {
    if (!aiSnake.active || aiSnake.points.length < 2) return;

    const pts = aiSnake.points;
    let totalLen = 0;
    const dists = [0];
    for (let i = 1; i < pts.length; i++) {
        totalLen += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
        dists.push(totalLen);
    }

    // 身体
    for (let i = pts.length - 2; i >= 0; i--) {
        const t = totalLen > 0 ? 1 - dists[i] / totalLen : 0;
        const alpha = 0.2 + 0.7 * t;
        const radius = AI_RADIUS * (0.35 + 0.65 * t);
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = AI_COLOR_BODY;
        ctx.lineWidth = radius * 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[i+1].x, pts[i+1].y);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 蛇头
    const hx = pts[0].x, hy = pts[0].y;
    const hGrad = ctx.createRadialGradient(hx - 1, hy - 1, 1, hx, hy, AI_RADIUS + 2);
    hGrad.addColorStop(0, '#ff8c55');
    hGrad.addColorStop(1, AI_COLOR_HEAD);
    ctx.fillStyle = hGrad;
    ctx.shadowColor = AI_COLOR_HEAD;
    ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(hx, hy, AI_RADIUS + 1, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // 眼睛
    const eyeOff = AI_RADIUS * 0.55;
    const perp   = aiSnake.angle + Math.PI / 2;
    const eyeFwd = AI_RADIUS * 0.4;
    const eyeR   = AI_RADIUS * 0.28;
    [1, -1].forEach(s => {
        const ex = hx + Math.cos(aiSnake.angle) * eyeFwd + Math.cos(perp) * eyeOff * s;
        const ey = hy + Math.sin(aiSnake.angle) * eyeFwd + Math.sin(perp) * eyeOff * s;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(ex + Math.cos(aiSnake.angle)*eyeR*0.4,
            ey + Math.sin(aiSnake.angle)*eyeR*0.4, eyeR*0.55, 0, Math.PI*2); ctx.fill();
    });

    // "AI" 标签
    const fontSize = Math.round((AI_RADIUS + 1) * 1.5);
    ctx.save();
    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 3;
    ctx.fillStyle = '#fff';
    ctx.fillText('AI', hx, hy);
    ctx.restore();

    // AI 得分小气泡
    for (let i = aiPopups.length - 1; i >= 0; i--) {
        const p = aiPopups[i];
        ctx.save();
        ctx.globalAlpha = p.life / 50;
        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = '#ff9f6b';
        ctx.textAlign = 'center';
        ctx.fillText(p.isEgg ? 'AI🥚' : 'AI+5', p.x, p.y);
        ctx.restore();
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) aiPopups.splice(i, 1);
    }
}

// AI 得分展示在 HUD（可选：右下角小角标）

function drawEggFood() {
    if (!eggFood) return;
    const t = performance.now() / 1000;
    const pulse = 0.88 + 0.12 * Math.sin(t * 3);
    const r = FOOD_RADIUS * 1.5 * pulse;
    const fx = eggFood.x, fy = eggFood.y;

    // 外层彩虹光晕（旋转）
    ctx.save();
    ctx.translate(fx, fy);
    const haloR = r * 2.4;
    for (let i = 0; i < 6; i++) {
        const a = t * 1.8 + (i * Math.PI / 3);
        const hx2 = Math.cos(a) * r * 0.7;
        const hy2 = Math.sin(a) * r * 0.7;
        const hg = ctx.createRadialGradient(hx2, hy2, 0, hx2, hy2, haloR * 0.7);
        hg.addColorStop(0, ['#ff2d55','#ff9500','#ffcc00','#34c759','#007aff','#bf5af2'][i] + '66');
        hg.addColorStop(1, 'transparent');
        ctx.fillStyle = hg;
        ctx.beginPath(); ctx.arc(hx2, hy2, haloR * 0.7, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();

    // 蛋体（椭圆渐变）
    ctx.save();
    ctx.translate(fx, fy);
    ctx.scale(1, 1.25); // 椭圆形
    const eggGrad = ctx.createRadialGradient(-r*0.25, -r*0.3, r*0.05, 0, 0, r);
    eggGrad.addColorStop(0, '#fff9c4');
    eggGrad.addColorStop(0.4, '#ffe066');
    eggGrad.addColorStop(1, '#ff9500');
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 20;
    ctx.fillStyle = eggGrad;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // 彩色条纹
    ctx.save();
    ctx.translate(fx, fy);
    ctx.scale(1, 1.25);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.clip();
    for (let i = 0; i < 3; i++) {
        const stripeColors = ['#ff2d55','#007aff','#34c759'];
        ctx.strokeStyle = stripeColors[i] + 'aa';
        ctx.lineWidth = r * 0.28;
        ctx.beginPath();
        ctx.arc(0, 0, r * (0.3 + i * 0.28), 0, Math.PI);
        ctx.stroke();
    }
    ctx.restore();

    // 高光
    ctx.save();
    ctx.translate(fx, fy - r * 0.12);
    ctx.scale(1, 1.25);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.ellipse(-r*0.18, -r*0.28, r*0.28, r*0.18, -0.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // "500" 标签
    ctx.save();
    ctx.font = `bold ${Math.round(r * 0.85)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#fff';
    ctx.fillText('★500', fx, fy + r * 1.55 * 1.25 + r * 0.5);
    ctx.restore();
}

// ── COMBO ─────────────────────────────────
function triggerCombo() {
    isComboMode = true;
    canvas.classList.add('combo-glow');
    comboText.textContent = `🔥 COMBO x${Math.floor(foodEatenCount/5)}!`;
    comboText.classList.add('show');
    currentHeadColor = headThemes[Math.floor(Math.random() * headThemes.length)];
    setTimeout(() => {
        canvas.classList.remove('combo-glow');
        comboText.classList.remove('show');
        isComboMode = false;
    }, 1200);
}

// ── PAUSE / EXIT ──────────────────────────
function togglePause() {
    if (!gameRunning) return;
    isPaused = !isPaused;
    pauseOverlay.style.display = isPaused ? 'flex' : 'none';
    pauseBtn.textContent = isPaused ? '继续' : '暂停';
    if (isPaused) { autoSaveGame(); lastTime = performance.now(); }
}

function exitGame() {
    if (confirm('退出游戏？当前进度将自动保存。')) {
        autoSaveGame();
        gameRunning = false;
        if (rafId) cancelAnimationFrame(rafId);
        showPage('menuPage');
        updateLeaderboardUI();
    }
}

// ── GAME OVER ─────────────────────────────
function handleGameOver() {
    gameRunning = false;
    if (rafId) cancelAnimationFrame(rafId);
    saveScore(currentPlayerName, score);

    canvas.style.borderColor = '#e94560';
    canvas.style.boxShadow = '0 0 30px rgba(233,69,96,.8)';
    setTimeout(() => {
        canvas.style.borderColor = '';
        canvas.style.boxShadow = '';
        alert(`💥 游戏结束！\n${currentPlayerName} 得了 ${score} 分`);
        showPage('menuPage');
        updateLeaderboardUI();
    }, 300);
}

// ── SAVE / LOAD ───────────────────────────
function checkSavedGame() {
    const hasData = !!localStorage.getItem('snake360_saved');
    loadBtn.disabled = !hasData;
}

function autoSaveGame() {
    try {
        localStorage.setItem('snake360_saved', JSON.stringify({
            snakePoints, snakeLength, angle, score, snakeSpeed,
            currentPlayerName, playerChar, foodEatenCount, currentHeadColor, food
        }));
        checkSavedGame();
    } catch (e) {
        console.error('存档保存失败:', e);
    }
}

function loadSavedGame() {
    const raw = localStorage.getItem('snake360_saved');
    if (!raw) {
        alert('没有找到存档数据！');
        return;
    }
    try {
        const d = JSON.parse(raw);
        snakePoints = d.snakePoints; 
        snakeLength = d.snakeLength;
        angle = d.angle; 
        targetAngle = d.angle; 
        hasJoystickInput = false;
        score = d.score; 
        snakeSpeed = d.snakeSpeed || 3.5;
        currentPlayerName = d.currentPlayerName || '玩家';
        playerChar = d.playerChar || '🐍';
        foodEatenCount = d.foodEatenCount || 0;
        currentHeadColor = d.currentHeadColor || '#00d4aa';
        food = d.food || { x: 100, y: 100, type: 0 };
        if (food.type === undefined) food.type = 0;

        initGame(true);
    } catch (e) {
        alert('存档数据格式有误，无法读取。');
        console.error(e);
    }
}

// ── LEADERBOARD ───────────────────────────
function saveScore(name, sc) {
    let scores = JSON.parse(localStorage.getItem('snake_top3')) || [];
    scores.push({ name, score: sc });
    scores.sort((a,b) => b.score - a.score);
    localStorage.setItem('snake_top3', JSON.stringify(scores.slice(0,3)));
}

function updateLeaderboardUI() {
    const scores = JSON.parse(localStorage.getItem('snake_top3')) || [];
    const medals = ['🥇','🥈','🥉'];
    lbList.innerHTML = scores.length === 0
        ? '<li class="lb-item" style="justify-content:center;color:#8892a4;">暂无记录</li>'
        : '';
    scores.forEach((item, i) => {
        const li = document.createElement('li');
        li.className = 'lb-item';
        li.innerHTML = `<span><span class="lb-rank">${medals[i]}</span>${item.name}</span><span class="lb-score">${item.score} 分</span>`;
        lbList.appendChild(li);
    });
}

// ── PWA SERVICE WORKER REGISTRATION ───────
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('PWA ServiceWorker 注册成功:', reg.scope))
            .catch(err => console.log('PWA ServiceWorker 注册失败:', err));
    });
}
